[project]
authors = [{ name = "eemim", email = "eemim@protonmail.com" }]
name = "pypistale"
license = {text = "MIT"}
version = "0.1.0"
description = "A CLI tool that checks how recently your project's dependencies were last updated on PyPI."
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "click>=8.0.0",
    "httpx>=0.23.0",
    "packaging>=21.0",
    'tomli>=2.0.0; python_version < "3.11"',
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Environment :: Console",
]

[project.urls]
Repository = "https://github.com/eemim/pypistale"
Issues = "https://github.com/eemim/pypistale/issues"

[project.scripts]
pypistale = "pypistale.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pypistale"]

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "pytest-asyncio>=0.24.0",
]
