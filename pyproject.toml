[project]
name = "pypi-tool"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "click>=8.0.0",
    "httpx>=0.23.0",
    "packaging>=21.0",
    "tomli>=2.0.0",
]

[project.scripts]
pypi-tool = "pypi_tool.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pypi_tool"]
